```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kirtika Alert</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background:
        radial-gradient(circle at top, #3b0a0a, transparent 40%),
        linear-gradient(135deg, #080808, #160606);
      color: white;
      overflow: hidden;
    }

    .card {
      width: min(90%, 520px);
      padding: 45px 35px;
      text-align: center;
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 80, 80, 0.25);
      backdrop-filter: blur(18px);
      box-shadow:
        0 25px 80px rgba(0, 0, 0, 0.6),
        0 0 60px rgba(255, 30, 30, 0.12);
    }

    .emoji {
      font-size: 64px;
      margin-bottom: 18px;
    }

    .badge {
      display: inline-block;
      padding: 7px 15px;
      border-radius: 50px;
      background: rgba(255, 50, 50, 0.15);
      border: 1px solid rgba(255, 80, 80, 0.3);
      color: #ff8a8a;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    h1 {
      font-size: clamp(30px, 6vw, 48px);
      line-height: 1.1;
      font-weight: 800;
      margin-bottom: 15px;
    }

    h1 span {
      color: #ff4d4d;
    }

    .subtitle {
      color: #bdbdbd;
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    .warning {
      padding: 16px;
      border-radius: 16px;
      background: rgba(255, 180, 0, 0.08);
      border: 1px solid rgba(255, 180, 0, 0.2);
      color: #ffd76a;
      font-size: 14px;
      margin-bottom: 25px;
    }

    .buttons {
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    .btn {
      padding: 13px 22px;
      border-radius: 12px;
      border: none;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
    }

    .primary {
      background: #ff4141;
      color: white;
    }

    .secondary {
      background: rgba(255,255,255,0.08);
      color: #ddd;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .footer {
      margin-top: 25px;
      color: #666;
      font-size: 12px;
    }

    @media (max-width: 480px) {
      .card {
        padding: 35px 22px;
      }

      .buttons {
        flex-direction: column;
      }

      .btn {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="emoji">☠️</div>

    <div class="badge">
      🚨 Kirtika Alert
    </div>

    <h1>
      Content <span>Sotta Marne</span><br>
      Chale Kirtika !!!
    </h1>

    <p class="subtitle">
      Kirtika ruk ja... 😭<br>
      Itna bhi serious content nahi hai ki seedha upar jaana pade!
    </p>

    <div class="warning">
      ⚠️ <strong>Warning:</strong><br>
      Overthinking detected. Please relax and continue scrolling.
    </div>

    <div class="buttons">
      <a href="#" class="btn primary">
        😂 Theek Hai
      </a>

      <a href="#" class="btn secondary">
        😭 Mujhe Chhod Do
      </a>
    </div>

    <div class="footer">
      Made  for Kirtika
    </div>

  </div>

</body>
</html>
